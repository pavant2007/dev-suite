apiVersion: v1
kind: Secret
metadata:
  name: vscode-auth
  labels:
    app: vscode
type: Opaque
stringData:
  # code-server login password
  password: "<change-me>"
  # Public SSH key(s) for Antigravity Remote-SSH (one per line); leave empty to disable sshd
  ssh-authorized-keys: ""
  # Optional API keys for the AI agents (otherwise log in interactively with `claude` / `codex login`)
  # anthropic-api-key: "sk-ant-..."
  # openai-api-key: "sk-..."
